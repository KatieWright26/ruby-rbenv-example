steps:
  - name: ":rspec:"
    command: >-
      bundle install &&
      bundle exec rspec --color
      --format progress
      --format RspecJunitFormatter --out results/rspec.xml
      spec
    plugins:
      - test-collector#v1.12.0:
          files: "results/*.xml"
          format: "junit"
          api-url: "http://analytics-api.buildkite.localhost/v1/uploads"
