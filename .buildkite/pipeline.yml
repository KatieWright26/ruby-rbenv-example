steps:
  - name: ":rspec:"
    env:
      # The suite the pre-command hook mints an OIDC token for. The suite must
      # exist, and its OIDC policy must admit this pipeline with the
      # write_uploads scope.
      TEST_ENGINE_SUITE_SLUG: "REPLACE_WITH_SUITE_SLUG"
    command: >-
      bundle install &&
      bundle exec rspec --color
      --format progress
      --format RspecJunitFormatter --out results/rspec.xml
      spec
    plugins:
      - test-collector#v1.12.0:
          files: "results/*.xml"
          format: "junit"
          api-url: "http://analytics-api.buildkite.localhost/v1/uploads"
